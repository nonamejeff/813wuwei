<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bird Match Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Wetland Birds of Florida</h1>
      <p>Match the bird sound to the correct image.</p>
    </header>

    <section class="scoreboard">
      <div class="points">Points: <span id="points">0</span></div>
      <div class="score">Rounds Correct: <span id="score">0</span></div>
      <div class="total">Total Rounds: <span id="total">0</span></div>
    </section>

    <section class="progress">
      <label for="round-progress">Bird Progress</label>
      <progress id="round-progress" value="0" max="0"></progress>
      <span id="round-label">0 / 0 birds</span>
    </section>

    <div class="controls">
      <button id="start-button" type="button">Start</button>
      <button id="reset-button" type="button">Reset Progress</button>
      <button id="next-button" type="button" disabled>Next</button>
      <label class="toggle">
        <input id="hard-mode-toggle" type="checkbox" />
        Hard mode (type the bird name)
      </label>
    </div>

    <section class="game" id="game" aria-live="polite">
      <div class="image-wrap">
        <img id="bird-image" src="" alt="" />
      </div>

      <div class="step" id="step-name">
        <h2 class="step-title" id="name-step-title">Step 1: Select the bird name.</h2>
        <div class="choices" id="name-choices" role="list"></div>
        <div class="hard-mode-input is-hidden" id="hard-mode-input">
          <input id="name-input" type="text" placeholder="Type the bird name" autocomplete="off" />
          <button id="submit-name" type="button">Submit Name</button>
        </div>
        <p class="feedback" id="name-feedback"></p>
      </div>

      <div class="step is-hidden" id="step-sound">
        <h2 class="step-title">Step 2: Play each sound, then select the match.</h2>
        <div class="choices" id="sound-choices" role="list"></div>
        <p class="feedback" id="sound-feedback"></p>
      </div>

      <p class="feedback" id="feedback"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
