<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biome Match Game</title>
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <main class="container">
    <header>
      <nav class="game-nav">
        <a href="/">Back to Atlas Home</a>
      </nav>
      <h1>Florida Biomes</h1>
      <p>Match the image to the correct biome name. Numbers 1-4 on your keyboard work too.</p>
    </header>

    <div class="controls">
      <button id="start-button" type="button">Start</button>
    </div>

    <section class="game" id="game" aria-live="polite">
      <div class="image-wrap">
        <img id="biome-image" src="" alt="" />
      </div>

      <div class="step is-hidden" id="step-name">
        <h2 class="step-title" id="name-step-title">Step 1: Select the biome name.</h2>
        <div class="choices" id="name-choices" role="list"></div>
        <p class="feedback" id="name-feedback"></p>
      </div>

      <section class="biome-info is-hidden" id="biome-info">
        <h3 id="biome-info-title"></h3>
        <p id="biome-info-description"></p>
        <p class="biome-info-where" id="biome-info-where"></p>
      </section>

      <p class="feedback" id="feedback"></p>

      <div class="next-wrap is-hidden">
        <button id="next-button" type="button" disabled>Next</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
