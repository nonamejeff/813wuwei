<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eaton 18-Speed Sim - 813 Wu Wei</title>
  <meta
    name="description"
    content="Private Eaton Fuller 18-speed simulator with a realistic stick layout, range and splitter controls, speedometer, and tachometer."
  />
  <meta property="og:title" content="Eaton 18-Speed Sim - 813 Wu Wei" />
  <meta property="og:description" content="Private Eaton Fuller 18-speed simulator." />
  <meta property="og:type" content="website" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://813wuwei.com/games/rt18-trainer/" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <main class="sim-shell">
    <nav class="page-nav">
      <a href="/">Back</a>
    </nav>

    <section class="dash-row">
      <article class="gauge-card">
        <div class="gauge-face">
          <div class="gauge-arc speed-arc"></div>
          <div class="needle" id="speed-needle"></div>
          <div class="gauge-center">
            <strong id="speed-readout">0.0</strong>
            <span>MPH</span>
          </div>
        </div>
      </article>

      <article class="gear-card">
        <span class="gear-caption">Current Gear</span>
        <strong id="gear-display">N</strong>
        <span class="gear-label" id="gear-label">Neutral</span>
        <div class="gear-status">
          <span id="range-status">Range Low</span>
          <span id="split-status">Split Low</span>
          <span id="box-status">Box Low</span>
        </div>
      </article>

      <article class="gauge-card">
        <div class="gauge-face">
          <div class="gauge-arc rpm-arc"></div>
          <div class="needle" id="rpm-needle"></div>
          <div class="gauge-center">
            <strong id="rpm-readout">650</strong>
            <span>RPM</span>
          </div>
        </div>
      </article>
    </section>

    <section class="road-row">
      <input
        id="speed-slider"
        class="speed-slider"
        type="range"
        min="0"
        max="75"
        step="0.5"
        value="0"
        aria-label="Road speed"
      />
    </section>

    <section class="control-row">
      <article class="switch-panel">
        <div class="toggle-block">
          <span class="toggle-label">Range</span>
          <div class="range-toggle" id="range-toggle" data-active="low" aria-label="Range switch">
            <span class="range-thumb" aria-hidden="true"></span>
            <button class="toggle-button high" data-control="range" data-value="high" type="button">
              High
            </button>
            <button class="toggle-button low" data-control="range" data-value="low" type="button">
              Low
            </button>
          </div>
        </div>

        <div class="toggle-block">
          <span class="toggle-label">Split</span>
          <div class="split-toggle" id="split-toggle" data-active="low" aria-label="Splitter button">
            <span class="split-thumb" aria-hidden="true"></span>
            <button class="toggle-button low" data-control="split" data-value="low" type="button">
              Low
            </button>
            <button class="toggle-button high" data-control="split" data-value="high" type="button">
              High
            </button>
          </div>
        </div>
      </article>

      <article class="knob-panel">
        <button id="neutral-button" class="neutral-button" type="button">Neutral</button>

        <div class="knob-face" role="group" aria-label="Eaton 18-speed shifter face">
          <span class="trace trace-left-vertical"></span>
          <span class="trace trace-horizontal"></span>
          <span class="trace trace-center-vertical"></span>
          <span class="trace trace-right-vertical"></span>

          <button class="stick-button reverse" data-slot="reverse" type="button" aria-label="Reverse position">
            <span class="reverse-stack">
              <span>HI</span>
              <span class="gear-mark">R</span>
              <span>LO</span>
            </span>
          </button>

          <button class="stick-button low" data-slot="low" type="button" aria-label="Low position">
            <span class="single-gear">LO</span>
            <span class="split-mark">
              <span>H</span>
              <span>L</span>
            </span>
          </button>

          <button class="stick-button one" data-slot="one" type="button" aria-label="1 and 5 position">
            <span class="gear-stack">
              <span>5</span>
              <span>1</span>
            </span>
            <span class="split-mark">
              <span>H</span>
              <span>L</span>
            </span>
          </button>

          <button class="stick-button two" data-slot="two" type="button" aria-label="2 and 6 position">
            <span class="gear-stack">
              <span>6</span>
              <span>2</span>
            </span>
            <span class="split-mark">
              <span>H</span>
              <span>L</span>
            </span>
          </button>

          <button class="stick-button three" data-slot="three" type="button" aria-label="3 and 7 position">
            <span class="gear-stack">
              <span>7</span>
              <span>3</span>
            </span>
            <span class="split-mark">
              <span>H</span>
              <span>L</span>
            </span>
          </button>

          <button class="stick-button four" data-slot="four" type="button" aria-label="4 and 8 position">
            <span class="gear-stack">
              <span>8</span>
              <span>4</span>
            </span>
            <span class="split-mark">
              <span>H</span>
              <span>L</span>
            </span>
          </button>
        </div>
      </article>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
